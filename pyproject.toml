[project]
name = "rpi-cloudflare-ddns"
version = "2.3.0"
description = "Python script to update DNS records with your current external IP using the Cloudflare API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cloudflare==4.1.0",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
    "schema==0.7.7",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pyright>=1.1.404",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.1",
]

# Formatting / Linting
[tool.ruff]
[format]
select = [
    "F",  # pyflakes rules
    "E",  # pycodestyle error rules
    "W",  # pycodestyle warning rules
    "B",  # flake8-bugbear rules
    "I",  # isort rules
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
exclude = [
    "tests"
]

# Testing
[tool.pytest.ini_options]
pythonpath = [
    "src",
]
testpaths = [
    "tests",
]
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "raise ImportError",
]
show_missing = true
